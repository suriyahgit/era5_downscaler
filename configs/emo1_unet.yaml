run_name: "unet_emo1_alps"
seed: 42

data:
  spatial:
    west: 3    #3
    east: 6   #18
    south: 42  #42
    north: 45  #50

  temporal:
    start: "2015-01-01"
    end: "2020-12-31"

  bands:
    era5: ["t2m", "ssrd", "tp"]
    pressure: ["t_850"]
    dem: ["dem"]
    emo1: ["ta24", "pr", "rg"]

  stac_urls:
    ERA5_T2M_SSRD_TP: "https://stac.intertwin.fedcloud.eu/collections/ERA5_T2M_SSRD_TP"
    ERA5_PRESSURE: "https://stac.intertwin.fedcloud.eu/collections/ERA5_PRESSURE"
    EMO1_DEM: "https://stac.intertwin.fedcloud.eu/collections/EMO1_DEM"
    EMO1_TA24_PR_RG_PET_DAILY: "https://stac.intertwin.fedcloud.eu/collections/EMO1_TA24_PR_RG_PET_DAILY"

  patch:
    size_y: 128
    size_x: 128
    stride_y: 64
    stride_x: 64

  split:
    train_years: [2015, 2018]  # inclusive
    val_years:   [2019, 2019]
    test_years:  [2020, 2020]

  predictors_feature_dir: "/mnt/CEPH_PROJECTS/InterTwin/Climate_Downscaling/PAPER/v2/train_predictors_features"
  targets_feature_dir: "/mnt/CEPH_PROJECTS/InterTwin/Climate_Downscaling/PAPER/v2/train_targets_features"

  # NEW (optional): target chunk size in bytes (≈5 MB)
  target_chunk_bytes: 5,242,880

model:
  name: "unet"
  params:
    in_channels: 5          # adapt to your actual features
    out_channels: 1         # EMO1 ta24
    base_channels: 64
    num_down_blocks: 4
    convs_per_block: 2
    norm: "group"
    norm_groups: 8
    activation: "relu"
    dropout: 0.1
    upsample_mode: "bilinear"
    residual_output: true

trainer:
  max_epochs: 80
  accelerator: "gpu"
  devices: 1
  precision: "16-mixed"
  gradient_clip_val: 1.0
  batch_size: 8
  num_workers: 4

  optimizer:
    name: "adamw"
    lr: 0.0003
    weight_decay: 0.00001

  scheduler:
    name: "cosine"
    warmup_epochs: 5

  early_stopping:
    monitor: "val_rmse"
    patience: 10
    mode: "min"

  checkpoint:
    monitor: "val_rmse"
    mode: "min"

mlflow:
  tracking_uri: "file:./mlruns"
  experiment_name: "emo1_alps_downscaling"
  run_name_suffix: ""
